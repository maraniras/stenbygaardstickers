<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Julekalenderens præmieikoner</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #15121c; color: #fff4de; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 1040px; margin: auto; padding: 30px; }
      h1 { margin: 0 0 6px; font: bold 30px Georgia, serif; }
      p { color: #c7bbce; margin: 0 0 24px; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
      figure { margin: 0; padding: 16px; }
      img { display: block; width: 100%; height: 240px; object-fit: contain; filter: drop-shadow(0 7px 8px #0005); }
      figcaption { text-align: center; font-weight: 650; margin-top: 10px; }
      @media (max-width: 650px) { main { padding: 18px; } .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } img { height: 180px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Julekalenderens præmieikoner</h1>
      <p>Julegran, små lys og pynt · fri silhuet med transparent baggrund · beløb ikke fastlagt</p>
      <div class="grid">
        <figure><img src="../../../public/games/advent/banana-single-christmas-v2.webp" alt="En enkelt banan" /><figcaption>En enkelt banan</figcaption></figure>
        <figure><img src="../../../public/games/advent/banana-pile-small-christmas-v2.webp" alt="En lille bunke bananer" /><figcaption>Lille bunke bananer</figcaption></figure>
        <figure><img src="../../../public/games/advent/banana-pile-large-christmas-v2.webp" alt="En stor bunke bananer" /><figcaption>Stor bunke bananer</figcaption></figure>
        <figure><img src="../../../public/games/advent/mix-max-christmas-v2.webp" alt="Mix Max" /><figcaption>Mix Max</figcaption></figure>
        <figure><img src="../../../public/games/advent/red-wine-christmas-v2.webp" alt="Rødvin" /><figcaption>Rødvin</figcaption></figure>
        <figure><img src="../../../public/games/advent/white-wine-christmas-v2.webp" alt="Hvidvin" /><figcaption>Hvidvin</figcaption></figure>
        <figure><img src="../../../public/games/advent/cycling-bottle-christmas-v2.webp" alt="Blå og hvid cykeldrikkedunk" /><figcaption>Cykeldrikkedunk</figcaption></figure>
        <figure><img src="../../../public/games/advent/santa-christmas-v1.webp" alt="Julemanden" /><figcaption>Julemanden</figcaption></figure>
        <figure><img src="../../../public/games/advent/gift-friend-christmas-v1.webp" alt="Gave til en ven" /><figcaption>Gave til en ven</figcaption></figure>
        <figure><img src="../../../public/games/advent/gift-self-christmas-v1.webp" alt="Gave til sig selv" /><figcaption>Gave til sig selv</figcaption></figure>
      </div>
    </main>
  </body>
</html>
